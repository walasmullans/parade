<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walasmulla National School Interhouse Sports Meet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'school-primary': '#2c3e50',
                        'school-accent': '#25D366', // WhatsApp green
                        'whatsapp-green': '#25D366'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap');
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Navigation -->
    <nav class="bg-school-primary text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <svg class="w-10 h-10 mr-3" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v4a2 2 0 002 2h2.586l2.707 2.707a1 1 0 001.414 0L13 12h3a2 2 0 002-2V6a2 2 0 00-2-2H4zm3 8l-3 3h16l-3-3H7z" clip-rule="evenodd"/>
                </svg>
                <h1 class="text-2xl font-bold">Walasmulla National School</h1>
            </div>
            <div class="space-x-4">
                <a href="#register" class="hover:text-gray-300 transition">Register</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header id="home" class="bg-gradient-to-r from-blue-600 to-purple-700 text-white py-20 text-center">
        <div class="container mx-auto px-4">
            <h2 class="text-4xl md:text-5xl font-bold mb-6 animate-pulse">Interhouse Sports Meet 2024</h2>
            <p class="text-xl mb-8 max-w-2xl mx-auto">Celebrating Athletic Excellence and School Spirit</p>
            <div class="bg-white/20 backdrop-blur-sm p-6 rounded-xl max-w-md mx-auto">
                <div class="grid grid-cols-2 gap-4 text-left">
                    <div>
                        <h3 class="font-semibold text-yellow-200">Date</h3>
                        <p>March 15-16, 2024</p>
                    </div>
                    <div>
                        <h3 class="font-semibold text-yellow-200">Venue</h3>
                        <p>School Playground</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Registration Section -->
    <section id="register" class="bg-gray-100 py-16">
        <div class="container mx-auto px-4">
            <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold mb-6 text-center text-school-primary">Event Registration</h2>
                <form id="registrationForm" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 mb-2">Full Name</label>
                        <input type="text" id="name" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-school-accent">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Age</label>
                        <input type="number" id="age" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-school-accent">
                    </div>
                    <div>
                        <label class="block text-gray-700 mb-2">Contact Number</label>
                        <input type="tel" id="contact" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-school-accent" placeholder="07X XXX XXXX">
                    </div>
                    <button type="submit" class="w-full bg-whatsapp-green text-white py-3 rounded-lg hover:bg-green-700 transition duration-300 flex items-center justify-center">
                        <svg class="w-6 h-6 mr-2" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.867-2.03-.967-.272-.101-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.149-.173.198-.297.297-.495.099-.198.05-.372-.025-.521-.075-.149-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.041 1.016-1.041 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/>
                        </svg>
                        Register You Vehicle
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-school-primary text-white py-8">
        <div class="container mx-auto text-center">
            <p>&copy; 2025 Walasmulla National School. All Rights Reserved.</p>
            <p class="mt-2 text-sm">Contact: +94 47 224 5283</p>
        </div>
    </footer>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collect form data
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const contact = document.getElementById('contact').value;

            // Validate contact number (basic Sri Lankan phone number validation)
            const phoneRegex = /^0[0-9]{9}$/;
            if (!phoneRegex.test(contact)) {
                alert('Please enter a valid Sri Lankan phone number (10 digits, starting with 0)');
                return;
            }

            // Prepare WhatsApp message
            const message = `Sports Meet Registration:
Name: ${name}
Age: ${age}
Contact: ${contact}

Walasmulla National School Interhouse Sports Meet 2024`;

            // WhatsApp sharing (replace with school's official WhatsApp number)
            const whatsappNumber = '+94740811925'; // Replace with actual number
            const whatsappUrl = `https://wa.me/${whatsappNumber.replace(/\+|\s/g, '')}?text=${encodeURIComponent(message)}`;
            
            // Open WhatsApp
            window.open(whatsappUrl, '_blank');
        });
    </script>
</body>
</html>
